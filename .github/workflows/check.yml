name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every rule in the hooks exists because a real session got past it.
      # This is the gate that keeps them from regressing.
      - run: node tests/run.mjs
